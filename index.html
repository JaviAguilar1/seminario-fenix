<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fénix · Constancia diaria</title>
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#14110f;--card:#1f1a17;--card2:#2a231f;--tx:#f3ece6;--mut:#a89a8f;--ac:#f08a24;--ac2:#ffb35c;--ok:#4cb782;--warn:#e5b443;--bad:#d9534f;--line:#3a312b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:4px 0 2px}h2{font-size:1.08rem;margin:0 0 8px}h3{font-size:.95rem;margin:12px 0 4px;color:var(--ac2)}
p{margin:6px 0}.mut{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.pill{display:inline-block;background:var(--card2);border-radius:99px;padding:3px 10px;font-size:.8rem;color:var(--mut)}
.big{font-size:1.9rem;font-weight:700;color:var(--ac)}
input[type=text],textarea,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--card2);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:#1a0f05;font-weight:700}
button.sm{padding:6px 10px;font-size:.85rem}
button:disabled{opacity:.45}
.full{width:100%}
.chk{display:flex;gap:10px;align-items:center;padding:10px;background:var(--card2);border-radius:10px;margin:6px 0}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
.tog{display:flex;background:var(--card2);border-radius:12px;padding:4px}
.tog button{flex:1;background:transparent}.tog button.on{background:var(--ac);color:#1a0f05;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:#0f0c0b;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:112px;background:none;border-radius:0;padding:9px 2px 8px;font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.25rem}nav button.on{color:var(--ac)}
.mod{border-left:4px solid var(--ac)}
.ojo{background:#2e2410;border:1px solid #5b4718;border-radius:10px;padding:10px;margin-top:8px;font-size:.9rem}
.okb{background:#132a1f;border:1px solid #23523b;border-radius:10px;padding:10px;margin-top:8px;font-size:.9rem}
.list .it{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.list .it:last-child{border:0}
.lock{opacity:.5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.8rem}
.cal div{padding:8px 0;border-radius:8px;background:var(--card2)}
.cal .h{background:none;color:var(--mut)}.cal .e{background:none}
.cal .ok{background:var(--ok);color:#06140d;font-weight:700}.cal .pa{background:#5b4718}.cal .hoy{outline:2px solid var(--ac)}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.rng{display:flex;align-items:center;gap:10px}.rng input{flex:1;accent-color:var(--ac)}.rng b{width:26px;text-align:right}
.ficha{font-size:1.05rem;font-style:italic}
.abc{display:flex;gap:6px}.abc select{width:62px;flex:none}.abc input{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ok);color:#06140d;padding:8px 16px;border-radius:99px;font-weight:700;z-index:9;transition:opacity .3s}
.hide{display:none!important}
.back{background:none;color:var(--ac);padding:4px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
 <button data-v="hoy"><span>☀️</span>Hoy</button>
 <button data-v="plan"><span>🗺️</span>Plan</button>
 <button data-v="herr"><span>🛠️</span>Herramientas</button>
 <button data-v="hist"><span>📅</span>Historial</button>
 <button data-v="ajus"><span>⚙️</span>Ajustes</button>
</nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
